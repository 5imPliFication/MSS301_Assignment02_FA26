spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.application.name=MSWatch_HE190091
server.port=${WATCH_PORT:8083}

# Data Source - MS SQL Server
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_WATCH_NAME:DBWatch};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:true};
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:sa}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Microservice Clients
brand.service.url=${BRAND_SERVICE_URL:http://localhost:${BRAND_PORT:8082}}

spring.jpa.open-in-view=false

service.internal-key=${SERVICE_INTERNAL_KEY:assignment-local-service-key-change-before-deployment}

spring.cloud.openfeign.client.config.brand-service.defaultRequestHeaders.X-Internal-Key=${service.internal-key}
spring.cloud.openfeign.client.config.brand-service.connectTimeout=${BRAND_CONNECT_TIMEOUT:3000}
spring.cloud.openfeign.client.config.brand-service.readTimeout=${BRAND_READ_TIMEOUT:5000}
