spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.port=${GATEWAY_PORT:8080}
spring.application.name=APIGateway_HE190091

# Spring Cloud Gateway Routing Configuration
spring.cloud.gateway.routes[0].id=account-service
spring.cloud.gateway.routes[0].uri=${ACCOUNT_SERVICE_URL:http://localhost:${ACCOUNT_PORT:8081}}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/accounts/**

spring.cloud.gateway.routes[1].id=brand-service
spring.cloud.gateway.routes[1].uri=${BRAND_SERVICE_URL:http://localhost:${BRAND_PORT:8082}}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/brands/**

spring.cloud.gateway.routes[2].id=watch-service
spring.cloud.gateway.routes[2].uri=${WATCH_SERVICE_URL:http://localhost:${WATCH_PORT:8083}}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/watches/**

# CORS configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# JWT configuration for Gateway Filter
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

service.internal-key=${SERVICE_INTERNAL_KEY:assignment-local-service-key-change-before-deployment}
